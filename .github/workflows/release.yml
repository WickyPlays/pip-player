name: Package and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vx.x.x), e.g. v1.2.2"
        required: true
        type: string

jobs:
  release:
    permissions: write-all
    name: Create Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag }}"
            $version = $tag -replace '^v', ''
            Write-Host "Using workflow_dispatch tag: $tag"
            Write-Host "Version: $version"
            "TAG=$tag" >> $env:GITHUB_ENV
            "VERSION=$version" >> $env:GITHUB_ENV
            "IS_DISPATCH=true" >> $env:GITHUB_ENV
          } else {
            $tag = "${env:GITHUB_REF_NAME}"
            $version = $tag -replace '^v', ''
            Write-Host "Using push tag: $tag"
            Write-Host "Version: $version"
            "TAG=$tag" >> $env:GITHUB_ENV
            "VERSION=$version" >> $env:GITHUB_ENV
            "IS_DISPATCH=false" >> $env:GITHUB_ENV
          }

      - name: Update package.json version for workflow_dispatch
        if: env.IS_DISPATCH == 'true'
        shell: pwsh
        run: |
          $packageJson = Get-Content package.json | ConvertFrom-Json
          $packageJson.version = "${env:VERSION}"
          $packageJson | ConvertTo-Json -Depth 10 | Set-Content package.json
          Write-Host "Updated package.json version to ${env:VERSION}"

      - name: Commit and tag version for workflow_dispatch
        if: env.IS_DISPATCH == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Bump version to ${env:VERSION}"
          git push
          git tag "${env:TAG}"
          git push origin "${env:TAG}"

      - name: Package
        run: npm run package

      - name: Verify release files
        shell: pwsh
        run: |
          $version = "${env:VERSION}"

          if ($IsWindows) {
            $player = "release\build\PIP-Player $version.exe"
            $setup = "release\build\PIP-Player-Setup-$version.exe"

            Write-Host "Version: $version"
            Write-Host "Player:  $player"
            Write-Host "Setup:   $setup"

            if (-not (Test-Path -LiteralPath $player)) {
              throw "Missing release file: $player"
            }

            if (-not (Test-Path -LiteralPath $setup)) {
              throw "Missing release file: $setup"
            }

            if ((Get-Item -LiteralPath $player).Length -eq 0) {
              throw "Release file is empty: $player"
            }

            if ((Get-Item -LiteralPath $setup).Length -eq 0) {
              throw "Release file is empty: $setup"
            }

            "VERSION=$version" >> $env:GITHUB_ENV
            "PLAYER=$player" >> $env:GITHUB_ENV
            "SETUP=$setup" >> $env:GITHUB_ENV
          } else {
            $appimage = "release/build/PIP-Player-$version.AppImage"
            $deb = "release/build/pip-player_${version}_amd64.deb"

            Write-Host "Version: $version"
            Write-Host "AppImage: $appimage"
            Write-Host "Deb: $deb"

            if (-not (Test-Path -LiteralPath $appimage)) {
              throw "Missing release file: $appimage"
            }

            if (-not (Test-Path -LiteralPath $deb)) {
              throw "Missing release file: $deb"
            }

            if ((Get-Item -LiteralPath $appimage).Length -eq 0) {
              throw "Release file is empty: $appimage"
            }

            if ((Get-Item -LiteralPath $deb).Length -eq 0) {
              throw "Release file is empty: $deb"
            }

            "VERSION=$version" >> $env:GITHUB_ENV
            "APPIMAGE=$appimage" >> $env:GITHUB_ENV
            "DEB=$deb" >> $env:GITHUB_ENV
          }

      - name: Upload to asset release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if ($IsWindows) {
            gh release create "${env:TAG}" `
              "${env:PLAYER}" `
              "${env:SETUP}" `
              --generate-notes `
              --title "${env:TAG}"
          } else {
            gh release create "${env:TAG}" `
              "${env:APPIMAGE}" `
              "${env:DEB}" `
              --generate-notes `
              --title "${env:TAG}"
          }