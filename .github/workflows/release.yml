name: Package and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vx.x.x), e.g. v1.2.2"
        required: true
        type: string

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag }}"
          } elseif ("${env:GITHUB_REF_NAME}" -match "^v") {
            $tag = "${env:GITHUB_REF_NAME}"
          } else {
            # Fallback to package.json version for local testing
            $packageJson = Get-Content package.json | ConvertFrom-Json
            $tag = "v" + $packageJson.version
            Write-Host "Using package.json version for local testing: $tag"
          }

          $version = $tag -replace '^v', ''

          Write-Host "Tag: $tag"
          Write-Host "Version: $version"

          "TAG=$tag" >> $env:GITHUB_ENV
          "VERSION=$version" >> $env:GITHUB_ENV

          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate package.json version matches tag
        shell: pwsh
        run: |
          $packageJson = Get-Content package.json | ConvertFrom-Json
          $packageVersion = $packageJson.version

          # Skip validation if tag starts with 'v' (it's a real tag)
          if ("${env:TAG}" -match "^v\d") {
            if ($packageVersion -ne "${env:VERSION}") {
              throw "package.json version ($packageVersion) does not match tag version (${env:VERSION})"
            }
            Write-Host "Version validation passed: $packageVersion"
          } else {
            Write-Host "Skipping validation for local testing with package.json version: $packageVersion"
          }

      - name: Package
        run: npm run package

      - name: Verify Windows release files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${env:VERSION}"

          $player = "release\build\PIP-Player $version.exe"
          $setup = "release\build\PIP-Player-Setup-$version.exe"

          if (-not (Test-Path -LiteralPath $player)) {
            throw "Missing release file: $player"
          }

          if (-not (Test-Path -LiteralPath $setup)) {
            throw "Missing release file: $setup"
          }

          if ((Get-Item -LiteralPath $player).Length -eq 0) {
            throw "Release file is empty: $player"
          }

          if ((Get-Item -LiteralPath $setup).Length -eq 0) {
            throw "Release file is empty: $setup"
          }

      - name: Verify Linux release files
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $version = "${env:VERSION}"

          $appimage = "release/build/PIP-Player-$version.AppImage"
          $deb = "release/build/pip-player_${version}_amd64.deb"

          if (-not (Test-Path -LiteralPath $appimage)) {
            throw "Missing release file: $appimage"
          }

          if (-not (Test-Path -LiteralPath $deb)) {
            throw "Missing release file: $deb"
          }

          if ((Get-Item -LiteralPath $appimage).Length -eq 0) {
            throw "Release file is empty: $appimage"
          }

          if ((Get-Item -LiteralPath $deb).Length -eq 0) {
            throw "Release file is empty: $deb"
          }

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/build/PIP-Player ${{ steps.version.outputs.version }}.exe
            release/build/PIP-Player-Setup-${{ steps.version.outputs.version }}.exe

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            release/build/PIP-Player-${{ steps.version.outputs.version }}.AppImage
            release/build/pip-player_${{ steps.version.outputs.version }}_amd64.deb

  release:
    name: Create Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_REF_NAME}" =~ ^v ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            # Fallback to package.json version for local testing
            TAG="v$(node -p "require('./package.json').version")"
            echo "Using package.json version for local testing: $TAG"
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release

      - name: List release files
        run: |
          find release -type f -print

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            release/* \
            --generate-notes \
            --title "$TAG"